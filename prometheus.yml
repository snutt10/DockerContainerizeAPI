global:
  scrape_interval: 30s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: api1
    static_configs:
      - targets: ['game-api1:3000']
  - job_name: api2
    static_configs:
      - targets: ['game-api2:3000']
  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']
  - job_name: mongodb
    static_configs:
      - targets: ['mongodb-exporter:9216']
  - job_name: email-service
    static_configs:
      - targets: ['email-service:4000']