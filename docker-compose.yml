
services:
  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring
    restart: unless-stopped
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - monitoring
    restart: unless-stopped
  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - "3004:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus
  # Kafka broker
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    networks:
      - monitoring
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: game-api-mongo
    ports:
      - "27017:27017"
    networks:
      - monitoring
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: CSC380
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Game API instance 1
  game-api1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - APP_NAME=GameAPI1
      - PORT=3000
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/CSC380?authSource=admin
      - KAFKA_BROKER=kafka:9092
    container_name: game-api1
    networks:
      - monitoring
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Game API instance 2
  game-api2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - APP_NAME=GameAPI2
      - PORT=3000
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/CSC380?authSource=admin
      - KAFKA_BROKER=kafka:9092
    container_name: game-api2
    networks:
      - monitoring
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Nginx load balancer
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8080:8080"
    networks:
      - monitoring
    depends_on:
      - game-api1
      - game-api2
    restart: unless-stopped

  # exporter for nginx metrics
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    ports:
      - "9113:9113"
    networks:
      - monitoring
    depends_on:
      - nginx
    command: ["-nginx.scrape-uri", "http://nginx:8080/stub_status"]
    restart: unless-stopped
  # MongoDB exporter for Prometheus metrics
  mongodb-exporter:
    image: bitnami/mongodb-exporter:latest
    container_name: mongodb-exporter
    ports:
      - "9216:9216"
    networks:
      - monitoring
    environment:
      - MONGODB_NAMESPACE=admin
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/CSC380?authSource=admin
    depends_on:
      - mongodb
    restart: unless-stopped

  # Email service (Kafka consumer)
  email-service:
    build:
      context: .
      dockerfile: Dockerfile.email
    ports:
      - "4000:4000"
    container_name: email-service
    networks:
      - monitoring
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/CSC380?authSource=admin
      - KAFKA_BROKER=kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      game-api1:
        condition: service_started
    restart: unless-stopped

volumes:
  prometheus_data:
  mongodb_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge